<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Open FilaManager</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f4f2e9;
        color: #18211b;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(32rem, calc(100% - 3rem));
        padding: 2rem;
        border: 1px solid #d8ddd5;
        border-radius: 1.5rem;
        background: #fffef8;
        box-shadow: 0 1rem 3rem rgb(24 40 30 / 10%);
      }
      h1 { margin-top: 0; }
      p { color: #68736b; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <h1>Open this tag with FilaManager</h1>
      <p>
        Install FilaManager on this device, then scan the storage-slot tag
        again. The storage-slot identity and inventory stay on your device.
      </p>
    </main>
  </body>
</html>
